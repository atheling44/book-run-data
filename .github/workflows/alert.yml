name: 점검 알림

# 점검이 alerts/날짜.md 를 올리면 이슈로 만든다 → 저장소 주인에게 깃허브 알림(메일·앱)이 간다.
# 지난 알림 이슈는 닫는다(늘 최신 하나만 열려 있게).
on:
  push:
    branches: [main]
    paths: ['alerts/**']

permissions:
  issues: write
  contents: read

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 새 알림을 이슈로
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create 점검 --color D93F0B --force --repo "$GITHUB_REPOSITORY" >/dev/null
          files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- alerts/ || ls alerts/*.md)
          for f in $files; do
            for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label 점검 --state open --json number -q '.[].number'); do
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" >/dev/null
            done
            gh issue create --repo "$GITHUB_REPOSITORY" --label 점검 --title "$(head -1 "$f")" --body-file "$f"
          done
